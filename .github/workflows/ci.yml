name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # dist/ is what people install, so it must match the sources it claims
      # to be built from. This fails the build if someone forgot to rebuild.
      - name: Verify the committed bundle is current
        run: npm run verify:dist

      - name: Confirm the bundle is installable
        run: |
          head -1 dist/threadcalm.user.js | grep -q '==UserScript=='
          grep -q 'NOT AFFILIATED WITH MICROSOFT' dist/threadcalm.user.js
